services:
  mysql:
    image: mysql:8.0
    container_name: financiera_intesa_backend_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./bd11:/docker-entrypoint-initdb.d
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - financiera_intesa_backend_network
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: financiera_intesa_backend_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root 
      UPLOAD_LIMIT: 300M
    ports:
      - "8081:81"
    depends_on:
      - mysql
    networks:
      - financiera_intesa_backend_network

volumes:
  mysql_data:
    driver: local

networks:
  financiera_intesa_backend_network:
    driver: bridge

